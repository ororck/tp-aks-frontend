name: deploy

# Déclenchement manuel uniquement : un merge ne déploie jamais.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  RG_NAME: msaidiRG
  OWNER_TAG: mohamed-saidi
  # Le cluster mutualisé n'est pas à nous et ne peut pas être tagué : il est
  # référencé par nom (exception documentée, ADR 0005 du dépôt terraform).
  AKS_NAME: aks-nonprod-prf2026
  AKS_RG: rg-shared-prf2026
  NAMESPACE: mohamed-saidi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Découvrir le registre par tags
        run: |
          ACR=$(az acr list -g "$RG_NAME" --query "[?tags.owner=='$OWNER_TAG' && tags.component=='acr'].name | [0]" -o tsv)
          test -n "$ACR"
          echo "ACR_NAME=$ACR" >> "$GITHUB_ENV"
          echo "IMAGE=$ACR.azurecr.io/quiz-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build et push de l'image
        run: |
          az acr login --name "$ACR_NAME"
          # Le Dockerfile exige des build args non vides. /api passe par le proxy nginx,
          # la clé est factice : aucune clé d'API applicative entre front et back.
          docker build --build-arg API_BASE_URL=/api --build-arg API_KEY=unused -t "$IMAGE" .
          docker push "$IMAGE"

      # L'IP d'entrée du cluster partagé a déjà changé une fois : elle est lue
      # à chaque déploiement sur l'IP publique du node RG que AKS tague pour le
      # Service app-routing-system/nginx (même logique que l'output Terraform
      # ingress_host). Rôle Reader sur le node RG, voir scripts/oidc.sh.
      - name: Résoudre l'hôte de l'ingress
        run: |
          NODE_RG=$(az aks show -g "$AKS_RG" -n "$AKS_NAME" --query nodeResourceGroup -o tsv)
          IP=$(az network public-ip list -g "$NODE_RG" \
            --query "[?tags.\"k8s-azure-service\"=='app-routing-system/nginx'].ipAddress | [0]" -o tsv)
          test -n "$IP"
          echo "INGRESS_HOST=$OWNER_TAG.$IP.nip.io" >> "$GITHUB_ENV"
          echo "Hôte : $OWNER_TAG.$IP.nip.io"

      - name: Installer kubelogin
        run: |
          curl -sSLO https://github.com/Azure/kubelogin/releases/latest/download/kubelogin-linux-amd64.zip
          unzip -q kubelogin-linux-amd64.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/

      - name: Déployer
        run: |
          az aks get-credentials -g "$AKS_RG" -n "$AKS_NAME" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          envsubst '${IMAGE}' < k8s/deployment.yaml | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" apply -f k8s/service.yaml
          envsubst '${INGRESS_HOST}' < k8s/ingress.yaml | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" rollout restart deployment/frontend
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=300s
