name: sonarcloud

# Qualité : SonarCloud produit le Quality Gate (livrable). Nécessite le secret
# SONAR_TOKEN et l'import du dépôt dans SonarCloud. Sans token, le job échoue
# franchement plutôt que de passer au vert sans rien analyser.
# Le Quality Gate bloque (sonar.qualitygate.wait=true).
# Doc : https://docs.sonarsource.com/sonarqube-cloud/
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tests avec couverture
        run: npm run test:coverage
      - name: Vérifier le secret SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || (echo "::error::SONAR_TOKEN absent : importer le dépôt dans SonarCloud puis ajouter le secret" && exit 1)
      - uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ororck
            -Dsonar.projectKey=ororck_tp-aks-frontend
            -Dsonar.qualitygate.wait=true
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
