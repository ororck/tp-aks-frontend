server {
    # 8080, not 80 -- the Deployment runs this container as a non-root user
    # (runAsUser: 101, deployment.yaml), which can't bind a port below 1024.
    # The k8s Service still exposes port 80 externally (service.yaml),
    # forwarding to this container port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy vers le Service ClusterIP du backend (jamais exposé).
    # Pas de slash final : le chemin /api/... est transmis tel quel.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # SPA fallback: any path Angular's router owns (not a real file on disk)
    # must still serve index.html, or a hard refresh on e.g. /quiz/123 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Actuator-equivalent for this image -- AKS's readiness/liveness probes
    # (helm/templates/deployment.yaml) hit this instead of parsing the SPA.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
